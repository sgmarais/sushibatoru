<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>すし屋の攻防 AIコードバトル</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a1a2e; color: #e0e0e0; padding: 10px; margin: 0; text-align: center; }
        .container { max-width: 800px; margin: 10px auto; background-color: #16213e; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; }
        .api-area, .sync-area, .result-share-area { background-color: #0f3460; padding: 15px; margin-bottom: 20px; border-radius: 8px; text-align: left; }
        input { width: 100%; padding: 12px; margin-top: 8px; border-radius: 5px; border: none; font-size: 14px; box-sizing: border-box; }
        
        .role-badge { font-size: 22px; font-weight: bold; padding: 10px 20px; border-radius: 5px; display: inline-block; margin-bottom: 15px; }
        .role-attacker { background-color: #e94560; color: white; }
        .role-defender { background-color: #0077b6; color: white; }

        .cost-info { font-size: 18px; font-weight: bold; color: #f1c40f; margin-bottom: 10px; }

        .card-selection { display: flex; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
        .card { background-color: #533483; color: white; padding: 12px; border-radius: 10px; cursor: pointer; width: 31%; transition: 0.2s; border: 3px solid transparent; box-sizing: border-box; margin-bottom: 10px; }
        @media (max-width: 500px) { .card { width: 100%; } }
        .card.selected { border-color: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
        .card.disabled { opacity: 0.5; cursor: not-allowed; }

        textarea { width: 100%; height: 80px; margin: 10px 0; border-radius: 8px; padding: 10px; font-size: 16px; box-sizing: border-box; background: #e0e0e0; }
        button { background-color: #f1c40f; color: #1a1a2e; border: none; padding: 15px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background-color: #d4ac0d; }
        .copy-btn { background-color: #7f8c8d; font-size: 12px; padding: 5px 10px; width: auto; color: white; margin-top: 5px; }

        .output-area { margin-top: 20px; padding: 15px; background-color: #0f3460; border-radius: 8px; word-break: break-all; text-align: left; border-left: 5px solid #f1c40f; }
        
        #result-box { background-color: #fdfbf7; color: #1a1a2e; padding: 25px; margin-top: 25px; border-radius: 10px; text-align: left; min-height: 200px; display: none; line-height: 1.8; font-size: 17px; }
        #result-title { text-align: center; border-bottom: 2px solid #ccc; padding-bottom:10px; font-size: 22px; font-weight: bold; color: #1a1a2e; }
        #type-cursor { display: inline-block; width: 10px; height: 20px; background: #e94560; margin-left: 5px; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🍣 すし屋の攻防 🍣</h1>

    <div class="api-area" id="api-box-wrapper">
        <label>🔑 <strong>先攻専用：APIキー入力</strong></label>
        <input type="password" id="api-key-input" autocapitalize="off" placeholder="AIzaSy...（後攻は不要）">
    </div>

    <div class="sync-area" id="sync-box-wrapper">
        <p style="margin:0;">📥 <strong>後攻：対戦コード読込</strong></p>
        <input type="text" id="enemy-code-input" autocapitalize="off" placeholder="友達のコードを貼り付け">
        <button onclick="loadEnemyCode()">コードを読み込む</button>
        <p id="enemy-status" style="color: #2ecc71; font-weight: bold; margin-top:5px;"></p>
    </div>

    <div class="result-share-area" id="result-view-wrapper">
        <p style="margin:0;">📬 <strong>先攻：結果コード読込</strong></p>
        <input type="text" id="result-code-input" autocapitalize="off" placeholder="友達から届いた結果コードを貼り付け">
        <button onclick="loadResultCode()" style="background-color: #9b59b6; color:white;">結果を表示</button>
    </div>

    <hr style="border: 1px dashed #444;">

    <div id="role-tag" class="role-badge">役割決定中...</div>
    
    <div class="hand-container">
        <div class="cost-info" id="cost-display">残りコスト: 7 / 7</div>
        <h3 style="margin-top:0;">🃏 カードを【2枚】選択（合計コスト7以下）</h3>
        <div class="card-selection" id="hand-display"></div>
    </div>

    <textarea id="strategy-input" placeholder="例：美食家のうんちくで大将を足止めし、その隙にYouTubeイーターが全メニューを制覇する！"></textarea>

    <button id="gen-btn" onclick="generateCode()">先攻：対戦コードを生成</button>

    <div class="output-area" id="output-box" style="display: none;">
        <p style="margin:0;">👇 友達に送るコード:</p>
        <button class="copy-btn" onclick="copyText('generated-code')">📋 コピーする</button>
        <div id="generated-code" style="color: #f1c40f; font-size: 10px; margin-top:10px;"></div>
    </div>

    <button class="battle-btn" id="battle-start-btn" onclick="startAIBattle()" style="display: none;">🍣 AIバトル開始（実況開始） 🍣</button>

    <div class="output-area" id="result-share-box" style="display: none; background-color: #27ae60;">
        <p style="margin:0; color:white; font-weight:bold;">🎉 バトル終了！結果コードを友達に送ろう：</p>
        <button class="copy-btn" style="background-color: #1a1a2e;" onclick="copyText('generated-result-code')">📋 結果コードをコピー</button>
        <div id="generated-result-code" style="color: #fff; font-size: 10px; margin-top:10px;"></div>
    </div>

    <div id="result-box">
        <div id="result-title">今始まるすし屋での戦いに</div>
        <div id="battle-log" style="margin-top: 15px;"></div><span id="type-cursor"></span>
    </div>
</div>

<script>
    const attackers = [
        { name: 'フードファイター', cost: 2, skill: 'ブラックホール', desc: '底なしの胃袋で完食' },
        { name: 'わがままギョーカイ人', cost: 3, skill: '裏メニュー要求', desc: '職人のペースを乱す' },
        { name: 'お相撲さん', cost: 5, skill: 'ごっつぁんラッシュ', desc: '大量注文で店を潰す' },
        { name: 'インバウンド観光客', cost: 4, skill: 'SUSHIマニア', desc: 'レアネタ狙い撃ち' },
        { name: 'ちびっこギャング', cost: 1, skill: 'ジュースこぼし', desc: '職人の防御を下げる' },
        { name: 'YouTubeイーター', cost: 4, skill: '生配信レビュー', desc: '絶賛で客を呼び込み圧をかける' },
        { name: '美食家', cost: 3, skill: 'うんちく攻撃', desc: '文句でスキルの発動を邪魔する' }
    ];

    const defenders = [
        { name: '見習い職人', cost: 1, skill: '全力あいさつ', desc: '勢いを堅実に削ぐ' },
        { name: 'ベテラン大将', cost: 5, skill: '極上大トロ握り', desc: '美味さで昇天させ一撃満腹' },
        { name: 'お茶くみロボット', cost: 2, skill: 'あつあつアタック', desc: 'お茶でお腹を膨らませる' },
        { name: '裏の仕掛け人', cost: 3, skill: '激辛ワサビ仕込み', desc: 'ワサビで足を止める' },
        { name: 'カリスマ女将', cost: 4, skill: 'お座敷トーク', desc: '話術で食べるペースを落とす' },
        { name: 'お会計ベテラン', cost: 3, skill: '皿チェック', desc: '食べた量を確認させ満腹度を刺激' },
        { name: '仕入れの達人', cost: 4, skill: '最高のネタ', desc: '高級ネタで客の財布(コスト)を削る' }
    ];

    let myRole = ""; 
    let currentHand = []; 
    let selectedCards = []; 
    let enemyData = null; 
    let sharedApiKey = "";

    window.onload = () => {
        myRole = ["attacker", "defender"][Math.floor(Math.random() * 2)];
        setupGame();
    };

    function setupGame() {
        selectedCards = [];
        const roleTag = document.getElementById('role-tag');
        const pool = (myRole === "attacker") ? attackers : defenders;
        roleTag.innerText = (myRole === "attacker") ? "🦈 大食い客 (攻め)" : "👨‍🍳 寿司職人 (守り)";
        roleTag.className = `role-badge role-${myRole}`;

        const shuffled = [...pool].sort(() => 0.5 - Math.random());
        currentHand = shuffled.slice(0, 3);

        updateDisplay();
    }

    function updateDisplay() {
        const totalCost = selectedCards.reduce((sum, c) => sum + c.cost, 0);
        document.getElementById('cost-display').innerText = `残りコスト: ${7 - totalCost} / 7`;

        const handDisplay = document.getElementById('hand-display');
        handDisplay.innerHTML = '';
        currentHand.forEach((char, index) => {
            const isSelected = selectedCards.find(c => c.name === char.name);
            const canSelect = isSelected || (selectedCards.length < 2 && totalCost + char.cost <= 7);
            
            handDisplay.innerHTML += `
                <div class="card ${isSelected ? 'selected' : ''} ${!canSelect ? 'disabled' : ''}" onclick="toggleSelect(${index})">
                    <h3 style="margin:5px 0;">${char.name}</h3>
                    <p style="font-size:12px;">コスト:${char.cost}<br>【${char.skill}】<br>(${char.desc})</p>
                </div>
            `;
        });
    }

    function toggleSelect(index) {
        const char = currentHand[index];
        const existing = selectedCards.findIndex(c => c.name === char.name);
        const totalCost = selectedCards.reduce((sum, c) => sum + c.cost, 0);

        if (existing > -1) {
            selectedCards.splice(existing, 1);
        } else if (selectedCards.length < 2 && totalCost + char.cost <= 7) {
            selectedCards.push(char);
        } else if (totalCost + char.cost > 7) {
            alert("コスト制限(7)を超えています！他のキャラを選んでください。");
        }
        updateDisplay();
    }

    function copyText(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => alert("📋 コピーしました！"));
    }

    function typeWriter(text, elementId, speed = 50) {
        const element = document.getElementById(elementId);
        const cursor = document.getElementById('type-cursor');
        element.innerText = "";
        cursor.style.display = "inline-block";
        let i = 0;
        function type() {
            if (i < text.length) {
                element.innerText += text.charAt(i);
                i++;
                window.scrollTo(0, document.body.scrollHeight);
                setTimeout(type, speed);
            } else {
                cursor.style.display = "none";
            }
        }
        type();
    }

    function generateCode() {
        const apiKey = document.getElementById('api-key-input').value.trim();
        if (!apiKey || selectedCards.length !== 2) { alert("キーの入力と2枚の選択が必要です！"); return; }
        const playerData = { apiKey, role: myRole, cards: selectedCards, strategy: document.getElementById('strategy-input').value };
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(playerData))));
        document.getElementById('generated-code').innerText = encoded;
        document.getElementById('output-box').style.display = 'block';
    }

    function loadEnemyCode() {
        let code = document.getElementById('enemy-code-input').value.trim().replace(/[\u201c\u201d\u2018\u2019]/g, "");
        try {
            enemyData = JSON.parse(decodeURIComponent(escape(atob(code))));
            sharedApiKey = enemyData.apiKey;
            myRole = (enemyData.role === "attacker") ? "defender" : "attacker";
            setupGame();
            document.getElementById('enemy-status').innerText = `読込成功！相手は[${(enemyData.role === "attacker") ? "客" : "職人"}]です。`;
            document.getElementById('api-box-wrapper').style.display = 'none';
            document.getElementById('result-view-wrapper').style.display = 'none';
            document.getElementById('battle-start-btn').style.display = 'block';
        } catch(e) { alert("コードが正しくありません。"); }
    }

    function loadResultCode() {
        let code = document.getElementById('result-code-input').value.trim().replace(/[\u201c\u201d\u2018\u2019]/g, "");
        try {
            const res = decodeURIComponent(escape(atob(code)));
            document.getElementById('result-box').style.display = 'block';
            typeWriter(res, 'battle-log', 30);
        } catch(e) { alert("結果コードが正しくありません。"); }
    }

    // バックアップ用モデルへの切り替え機能を追加したバトル開始関数
    async function startAIBattle() {
        const attackerInfo = (enemyData.role === "attacker") ? enemyData : { cards: selectedCards, strategy: document.getElementById('strategy-input').value };
        const defenderInfo = (enemyData.role === "defender") ? enemyData : { cards: selectedCards, strategy: document.getElementById('strategy-input').value };

        document.getElementById('result-box').style.display = 'block';
        document.getElementById('battle-log').innerText = "🚨 Gemini AIがカウンターでの死闘をシミュレーション中...";

        const promptText = `寿司屋のカウンターバトル実況。
客タッグ: ${attackerInfo.cards[0].name}, ${attackerInfo.cards[1].name} (作戦: ${attackerInfo.strategy})
職インタッグ: ${defenderInfo.cards[0].name}, ${defenderInfo.cards[1].name} (作戦: ${defenderInfo.strategy})
YouTubeイーターの生配信や、お会計ベテランの皿チェックなどのスキルコンボを盛り込み、熱血実慶してください。最後に勝敗（客の勝ち/職人の勝ち/引き分け）を宣言してください。日本語でドラマチックに！`;

        // まずは第1候補の最新モデルでトライ
        let success = await callGeminiAPI("gemini-2.5-flash", promptText);
        
        // もし大混雑（High Demand）などで失敗したら、第2候補の安定モデルで再トライ
        if (!success) {
            document.getElementById('battle-log').innerText = "🔄 メイン回線が混雑中... 予備の安定ルートに切り替えて再接続しています...";
            await new Promise(resolve => setTimeout(resolve, 1000)); // 1秒待機
            
            let backupSuccess = await callGeminiAPI("gemini-1.5-flash-latest", promptText);
            if (!backupSuccess) {
                document.getElementById('battle-log').innerText = "申し訳ありません。Google側のすべてのサーバーが現在非常に混み合っています。少し時間（数分）を空けてからもう一度お試しください。";
            }
        }
    }

    // APIを呼び出す共通の補助関数
    async function callGeminiAPI(modelName, prompt) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${sharedApiKey}`;
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            
            // 混雑エラー等がある場合は失敗と判定してbackupに回す
            if (data.error) {
                console.log(`Model ${modelName} failed:`, data.error.message);
                return false;
            }

            const resultText = data.candidates[0].content.parts[0].text;
            typeWriter(resultText, 'battle-log', 40);
            
            const encodedRes = btoa(unescape(encodeURIComponent(resultText)));
            document.getElementById('generated-result-code').innerText = encodedRes;
            document.getElementById('result-share-box').style.display = 'block';
            return true;
        } catch (e) {
            return false;
        }
    }
</script>
</body>
</html>
